serverName                       http3-video
user                             nobody
group                            nogroup
priority                         0
autoRestart                      1
chrootPath                       /
enableChroot                     0
inMemBufSize                     60M
swappingDir                      /tmp/lshttpd/swap
autoFix503                       1
gracefulRestartTimeout           300
mime                             conf/mime.properties
showVersionNumber                0
adminEmails                      root@localhost
indexFiles                       index.html
disableWebAdmin                  1

errorlog logs/error.log {
  logLevel                       WARN
  rollingSize                    10M
  enableStderrLog                1
}

accessLog logs/access.log {
  rollingSize                    10M
  keepDays                       30
  compressArchive                0
  logReferer                     1
  logUserAgent                   1
}

tuning {
  maxConnections                 10000
  maxSSLConnections              10000
  connTimeout                    300
  maxKeepAliveReq                10000
  smartKeepAlive                 0
  keepAliveTimeout               5
  sndBufSize                     0
  rcvBufSize                     0
  eventDispatcher                best
  maxCachedFileSize              4096
  totalInMemCacheSize            20M
  maxMMapFileSize                256K
  totalMMapCacheSize             40M
  useSendfile                    1
  fileETag                       28
  maxReqURLLen                   32768
  maxReqHeaderSize               65536
  maxReqBodySize                 2047M
  maxDynRespHeaderSize           32768
  maxDynRespSize                 2047M
  enableGzipCompress             1
  enableBrCompress               4
  enableDynGzipCompress          1
  gzipCompressLevel              6
  brStaticCompressLevel          6
  compressibleTypes              default
  gzipAutoUpdateStatic           1
  gzipMinFileSize                300
  quicEnable                     1
  quicShmDir                     /dev/shm
}

fileAccessControl {
  followSymbolLink               1
  checkSymbolLink                0
  requiredPermissionMask         000
  restrictedPermissionMask       000
}

perClientConnLimit {
  staticReqPerSec                0
  dynReqPerSec                   0
  outBandwidth                   0
  inBandwidth                    0
  softLimit                      10000
  hardLimit                      10000
  gracePeriod                    15
  banPeriod                      300
}

accessControl {
  allow                          ALL
}

virtualHost App {
  vhRoot                         /srv/
  allowSymbolLink                1
  enableScript                   1
  restrained                     0
  setUIDMode                     0
  configFile                     conf/vhosts/App/vhconf.conf
}

listener HTTP {
  address                        *:80
  secure                         0
  map                            App *
}

listener HTTPS {
  address                        *:443
  secure                         1
  keyFile                        conf/cert/server.key
  certFile                       conf/cert/server.crt
  certChain                      1
  sslProtocol                    30
  enableECDHE                    1
  renegProtection                1
  sslSessionCache                1
  sslSessionTickets              1
  enableSpdy                     15
  enableQuic                     1
  map                            App *
}

module cache {
  ls_enabled                     0
}
