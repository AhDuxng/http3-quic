services:
  custom:
    profiles: ["custom"]
    build:
      context: .
      dockerfile: custom_server/Dockerfile
    container_name: custom_server
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "${HTTP_PORT:-80}:80/tcp"
      - "${HTTPS_PORT:-443}:443/tcp"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./video:/srv/video:ro
      - ./openlitespeed_config/certs:/run/tls:ro
      - ./logs/custom-server:/var/log/custom-server
      - custom_server_certs:/var/lib/custom-server/cert
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - PORT=${PORT:-3000}
      - CUSTOM_MODE=${CUSTOM_MODE:-mpquic}
      - CUSTOM_SCHEDULER=${CUSTOM_SCHEDULER:-default}
      - CUSTOM_ADVERTISE_H3=${CUSTOM_ADVERTISE_H3:-true}
      - RUN_ID=${RUN_ID:-}
    command: ["--mode", "${CUSTOM_MODE:-mpquic}"]
    depends_on:
      - frontend
    networks:
      - app-network

  caddy:
    profiles: ["caddy"]
    build:
      context: ./caddy_config
      dockerfile: Dockerfile
    container_name: caddy_server
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./caddy_config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./video:/srv/video:ro
      - caddy_data:/data
      - caddy_runtime_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - PORT=${PORT:-3000}
    depends_on:
      - frontend
    networks:
      - app-network

  openlitespeed:
    profiles: ["openlitespeed"]
    build:
      context: ./openlitespeed_config
      dockerfile: Dockerfile
    container_name: openlitespeed_server
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    shm_size: 256mb
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./video:/srv/video:ro
      - ./openlitespeed_config/certs:/run/tls:ro
      - openlitespeed_certs:/usr/local/lsws/conf/cert
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      - frontend
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react_frontend
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: node_backend
    restart: unless-stopped
    network_mode: "service:${PROXY_SERVICE:-${COMPOSE_PROFILES:-openlitespeed}}"
    cap_add:
      - NET_ADMIN
    environment:
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-3000}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-3000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - "${PROXY_SERVICE:-${COMPOSE_PROFILES:-openlitespeed}}"

networks:
  app-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_runtime_config:
  custom_server_certs:
  openlitespeed_certs:
