services:
  openlitespeed:
    build:
      context: ./openlitespeed_config
      dockerfile: Dockerfile
    container_name: openlitespeed_server
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    shm_size: 256mb
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./video:/srv/video:ro
      - ./openlitespeed_config/certs:/run/tls:ro
      - openlitespeed_certs:/usr/local/lsws/conf/cert
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      - frontend
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react_frontend
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: node_backend
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    network_mode: "service:openlitespeed"
    environment:
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-3000}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-3000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - openlitespeed

networks:
  app-network:
    driver: bridge

volumes:
  openlitespeed_certs:
